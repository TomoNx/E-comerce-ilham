<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Comerce ilham</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm py-3">
        <div class="container">

            <!-- Logo brand Toko -->
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#"><i class="bi bi-bag-check-fill"></i> <span>E-comerce Ilham</span>
            </a>

            <!-- Cart Button -->
            <button type="button" class="btn btn-warning position-relative fw-semibold" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas"><i class="bi bi-cart3"></i> Keranjang
            <span class="badge bg-danger rounded-pill" id="cart-badge">0</span>
            </button>
        </div>
    </nav>

    <!-- Hero Section (Banner utama)-->
    <header class="container my-4">
        <div class="p-5 text-white bg-dark rounded-4 shadow-sm text-center">
            <h1> Toko Online E-Commerce ilham</h1>
            <p class="lead col-lg-8 mx-auto text-light">
                Katalog produk harian pilihan: elektronik, pakaian kasual, dan aksesoris berkualitas.
            </p>
            <a href="#katalog" class="btn btn-warning btn-lg px-4 fw-bold rounded-pill shadow-sm mt-2"><i class="bi bi-shop"></i> Lihat Katalog</a>
        </div>
    </header>

    <!-- Katalog Produk -->
     <main class="container my-4" id="katalog">
        <!-- Judul bagian katalog -->
         <div class="text-center mb-4">
            <h2 class="fw-bold">Katalog Produk</h2>
            <p class="text-muted">Pilih kategori produk yang anda sukai</p>
         </div>

         <!-- Tombol filter kategori-->
         <div class="d-flex justify-content-center flex-wrap gap-2 mb-4" id="category-filter-buttons">
            <button class="btn btn-dark active" onclick="filterCategory('Semua', this)">Semua</button>
            <button class="btn btn-outline-dark" onclick="filterCategory('Elektronik', this)">Elektronik</button>
            <button class="btn btn-outline-dark" onclick="filterCategory('Pakaian', this)">Pakaian</button>
            <button class="btn btn-outline-dark" onclick="filterCategory('Aksesoris', this)">Aksesoris</button>
         </div>

         <!-- Grid Tempat kartu produk di tampilkan-->
          <div id="product-container" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Data card di cetak otomatis oleh javascript-->
          </div>
     </main>

     <!-- OFF CANVAS CART-->
      <div class="offcanvas offcanvas-end" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="cartOffcanvasLabel"><i class="bi bi-cart-fill text-warning me-2"></i> Keranjang Belanja</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div id="cart-items" class="d-flex flex-column gap-3">
                <p class="text-muted text-center my-auto py-5">Keranjang belanja masih kosong</p>
            </div>
        </div>
        <!-- Total & Tombol Checkout -->
         <div class="p-3 border-top bg-light">
            <div class="d-flex justify-content-between align-items-center ">
                <span class="fw-semibold">Total Pembelian:</span>
                <span class="fw-bold fs-5 text-primary" id="cart-total">Rp 0</span>
            </div>
            <button class="btn btn-success w-100 fw-bold py-2 shadow-sm" id="checkout-btn">
                <i class="bi bi-whatsapp"></i> Checkout via WhatsApp
            </button>

         </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/producst.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
